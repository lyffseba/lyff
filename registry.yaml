# lyff offline portfolio registry
# Paths are relative to the lyff root. All orchestration is local-first.
version: 1
root: .
motto: "First do it, then do it right, then do it better."
offline: true

projects:
  - id: "43"
    name: "42 Projects Store"
    path: "43"
    role: school
    stack: [c]
    status: active
    offline_ok: true
    commands:
      test: "make -C libft bonus"
      docs: "libft/Subject.pdf"

  - id: "421"
    name: "Full 42 cursus mirror"
    path: "421"
    role: school
    stack: [c, php, python]
    status: active
    offline_ok: true
    remote: https://github.com/lyffseba/421.git
    commands:
      test: "make -C libft && make -C libft fclean"
      docs: "resources/norme.en.pdf"

  - id: "44"
    name: "Piscine World"
    path: "44"
    role: product
    stack: [node, three]
    status: active
    offline_ok: true
    commands:
      start: "npm run dev"
      install: "npm run install-cli"

  - id: ai
    name: "ai coding agent (pi fork)"
    path: ai
    role: product
    stack: [node, typescript]
    status: active
    offline_ok: partial  # needs model API for live chat; build is offline
    remote: https://github.com/lyffseba/ai-coding-agent.git
    commands:
      build: "npm run build"
      test: "npm test"

  - id: bet
    name: "bet terminal games"
    path: bet
    role: product
    stack: [rust]
    status: active
    offline_ok: true
    commands:
      build: "cargo build --release"
      run: "cargo run --release"

  - id: ents
    name: "Ents Academy"
    path: ents
    role: contest
    stack: [python, mojo, jax]
    status: active
    offline_ok: partial  # curriculum offline; live Gemini optional (demo mode works)
    commands:
      smoke: "ENTS_DISABLE_SCHEDULER=1 .venv/bin/python scripts/smoke_web.py"
      run: "uvicorn web.app:app --reload --port 8000"

  - id: maxi
    name: "maxi MAX kernels"
    path: maxi
    role: grant
    stack: [mojo, max]
    status: active
    offline_ok: true  # after pixi install once
    commands:
      test: "pixi run test"

  - id: witness
    name: "Witness model probes"
    path: witness
    role: product
    stack: [go]
    status: active
    offline_ok: partial  # build offline; live probes need keys
    commands:
      build: "make build"
      test: "make test"
